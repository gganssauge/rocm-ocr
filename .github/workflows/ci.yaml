name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.scratch/**'
      - '.gitignore'
      - 'LICENSE'
      - '.pre-commit-config.yaml'
      - '.markdownlint-cli2.yaml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for container-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            container:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yaml'

  test-and-analyze:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Run Ruff Linter
        run: uv run --locked --no-build ruff check .

      - name: Run Ruff Format check
        run: uv run --locked --no-build ruff format --check .

      - name: Run Type Checking (ty check)
        run: |
          uv tool install --no-build ty==0.0.86
          ty check

      - name: Run Tests with Coverage
        run: |
          uv run --locked --no-build pytest --cov=rocm_ocr --cov-report=xml --cov-report=term-missing tests/test_api.py tests/test_concurrency.py tests/test_config.py tests/test_engine.py tests/test_limits.py tests/test_middleware.py tests/test_parser.py tests/test_sandwich.py tests/test_update_docker_digests.py

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify zero SonarCloud Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          REPO="${{ github.repository }}"
          echo "Checking SonarCloud annotations for commit: $COMMIT_SHA"

          CHECK_RUN_ID=""
          for i in {1..6}; do
            CHECK_RUN_ID=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/check-runs" --jq '.check_runs[] | select(.name=="SonarCloud Code Analysis") | .id' 2>/dev/null || true)
            if [ -n "$CHECK_RUN_ID" ]; then
              STATUS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}" --jq '.status' 2>/dev/null || true)
              if [ "$STATUS" = "completed" ]; then
                break
              fi
            fi
            echo "Waiting for SonarCloud check-run to complete ($i/6)..."
            sleep 5
          done

          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::warning::SonarCloud check-run not found or not completed."
            exit 0
          fi

          ANNOTATIONS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}/annotations")
          ISSUE_COUNT=$(echo "$ANNOTATIONS" | jq 'length')

          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "::error::SonarCloud reported $ISSUE_COUNT issue(s)!"
            echo "$ANNOTATIONS" | jq -r '.[] | "::error file=\(.path),line=\(.start_line)::[\(.path):\(.start_line)] SonarCloud [\(.annotation_level)]: \(.title)"'
            exit 1
          fi

          echo "SonarCloud analysis clean: 0 issues found."

  docker-build:
    name: Docker Build & Trivy Scan
    needs: changes
    if: needs.changes.outputs.container == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and load Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.2.1' }}
          tags: |
            rocm-ocr:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,mode=min' || '' }}

      - name: Enforce Trivy Quality Gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rocm-ocr:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker push "${tag}"
          done

      - name: Trigger Flux Image Update Webhook
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Fordere GitHub OIDC-Token für notification-controller an..."
          ID_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=notification-controller" \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')

          echo "Triggering ImageRepository scan..."
          RESPONSE_REPO=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://flux-notifications.gorki120.de/hook/021f0a71b00371dad51592e169d5e26d4a699f46b681ba82a305303477f8d07f" \
            -H "Authorization: Bearer $ID_TOKEN")
          HTTP_CODE_REPO=$(echo "$RESPONSE_REPO" | grep "HTTP_STATUS:" | cut -d':' -f2)
          if [[ "$HTTP_CODE_REPO" -ne 200 ]]; then
            echo "Fehler beim Triggern des ImageRepository Scans (HTTP $HTTP_CODE_REPO):"
            echo "$RESPONSE_REPO"
            exit 1
          fi

          echo "Waiting 10s for ImagePolicy update..."
          sleep 10

          echo "Triggering ImageUpdateAutomation..."
          RESPONSE_AUTO=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://flux-notifications.gorki120.de/hook/880c98dc9c02b9faaccd607d35b0a0a45bfb23e84ad2665611fcba9dd735b244" \
            -H "Authorization: Bearer $ID_TOKEN")
          HTTP_CODE_AUTO=$(echo "$RESPONSE_AUTO" | grep "HTTP_STATUS:" | cut -d':' -f2)
          if [[ "$HTTP_CODE_AUTO" -ne 200 ]]; then
            echo "Fehler beim Triggern der ImageUpdateAutomation (HTTP $HTTP_CODE_AUTO):"
            echo "$RESPONSE_AUTO"
            exit 1
          fi

          echo "Flux Image Update Webhooks erfolgreich ausgelöst."

  automerge:
    name: Auto-merge PR (Label 'automerge')
    needs:
      - changes
      - test-and-analyze
      - docker-build
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      needs.test-and-analyze.result == 'success' &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash and merge PR
        run: gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
