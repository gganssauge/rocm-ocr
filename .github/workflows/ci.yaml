name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-analyze:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      container_changed: ${{ steps.filter.outputs.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for container-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            container:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yaml'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Run Ruff Linter
        run: uv run --locked --no-build ruff check .

      - name: Run Ruff Format check
        run: uv run --locked --no-build ruff format --check .

      - name: Run Type Checking (ty check)
        run: |
          uv tool install --no-build ty==0.0.86
          ty check

      - name: Run Tests with Coverage
        run: |
          uv run --locked --no-build pytest --cov=rocm_ocr --cov-report=xml --cov-report=term-missing tests/test_api.py tests/test_concurrency.py tests/test_config.py tests/test_engine.py tests/test_middleware.py tests/test_parser.py tests/test_update_docker_digests.py

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify zero SonarCloud Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          REPO="${{ github.repository }}"
          echo "Checking SonarCloud annotations for commit: $COMMIT_SHA"

          CHECK_RUN_ID=""
          for i in {1..6}; do
            CHECK_RUN_ID=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/check-runs" --jq '.check_runs[] | select(.name=="SonarCloud Code Analysis") | .id' 2>/dev/null || true)
            if [ -n "$CHECK_RUN_ID" ]; then
              STATUS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}" --jq '.status' 2>/dev/null || true)
              if [ "$STATUS" = "completed" ]; then
                break
              fi
            fi
            echo "Waiting for SonarCloud check-run to complete ($i/6)..."
            sleep 5
          done

          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::warning::SonarCloud check-run not found or not completed."
            exit 0
          fi

          ANNOTATIONS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}/annotations")
          ISSUE_COUNT=$(echo "$ANNOTATIONS" | jq 'length')

          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "::error::SonarCloud reported $ISSUE_COUNT issue(s)!"
            echo "$ANNOTATIONS" | jq -r '.[] | "::error file=\(.path),line=\(.start_line)::[\(.path):\(.start_line)] SonarCloud [\(.annotation_level)]: \(.title)"'
            exit 1
          fi

          echo "SonarCloud analysis clean: 0 issues found."

  docker-build:
    name: Docker Build & Trivy Scan
    needs: test-and-analyze
    if: needs.test-and-analyze.outputs.container_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and load Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: |
            rocm-ocr:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Enforce Trivy Quality Gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rocm-ocr:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            docker push "${tag}"
          done

  automerge:
    name: Auto-merge PR (Label 'automerge')
    needs:
      - test-and-analyze
      - docker-build
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      needs.test-and-analyze.result == 'success' &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash and merge PR
        run: gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
