[project]
name = "rocm-ocr"
version = "0.1.0"
description = "High-performance standalone OCR microservice accelerated by AMD ROCm GPUs"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "rapidocr-onnxruntime>=1.4.0",
    "onnxruntime-rocm>=1.20.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "asgi-correlation-id>=5.0.1",
]

[tool.uv]
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_ocr"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
