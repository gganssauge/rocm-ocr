[project]
name = "rocm-ocr"
version = "0.2.1"
description = "High-performance standalone OCR microservice accelerated by AMD ROCm GPUs"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "asgi-correlation-id",
    "fastapi",
    "onnxruntime-rocm",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "python-multipart",
    "rapidocr-onnxruntime",
    "scalar-fastapi",
    "uvicorn[standard]",
]

[tool.uv]
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_ocr"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
