[project]
name = "rocm-ocr"
version = "0.1.0"
description = "High-performance standalone OCR microservice accelerated by AMD ROCm GPUs"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime-rocm==1.22.2.post3",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "asgi-correlation-id==5.0.1",
    "scalar-fastapi==1.9.1",
]

[tool.uv]
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_ocr"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
