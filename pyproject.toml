[project]
name = "rocm-ocr"
version = "0.2.2"
description = "High-performance standalone OCR microservice accelerated by AMD ROCm GPUs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Gottfried Ganßauge", email = "ganssauge@gorki120.de" },
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "asgi-correlation-id",
    "fastapi",
    "onnxruntime-rocm",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pymupdf>=1.28.2",
    "python-multipart",
    "rapidocr-onnxruntime",
    "scalar-fastapi",
    "uvicorn[standard]",
]

[tool.uv]
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_ocr"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
minversion = "6"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]

[tool.ty]

[tool.repo-review]
ignore = [
    "GH200",  # Maintained by Dependabot (Renovate is used instead)
    "PC140",  # Uses a type checker (managed via local ty hook)
    "PC160",  # Uses a spell checker
    "PC170",  # Uses PyGrep hooks (no rST files)
    "PC901", "PC902", "PC903",  # Pre-commit CI messages (GitHub Actions CI is used)
    "PP004",  # Does not upper cap Python requires (ROCm binary wheels require Python 3.12)
    "PY007",  # Task runner (nox/tox/pixi; uv is used directly)
    "RF002",  # Target version (Ruff reads project.requires-python)
    "SEC001", # zizmor GHA checker
]
